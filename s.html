<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Coachella Valley Spotlight</title>
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<!-- Postcard QR codes point here: coachellavalleyspotlight.com/s?b=<listing slug>.
     Counts a "scan" for that business in the tracker (shown on their dashboard and Spotlight Report),
     then sends the visitor to the business's page with ?from=qr, which opens their deal ticket if they have one.
     Todd's own browsers (?notrack=1) and automated browsers are not counted, same as every other page.
     Per-mailing short codes (2026-11-22): new codes are /s?c=<5-character code>. data/qr-codes.js turns the code into the
     business and the mailing ("<route>:<mail date>"), so each ad on each card has its own small QR and scans, claims and
     leads are counted for that mailing too. (/s?b=<slug>&m=<mailing> also works, but isn't printed anywhere.)
     Codes made before then have no m and are already printed, so they must keep working exactly as they are:
     PRINTED below credits them to the one card they were printed on. Never change or remove an entry once its card is out. -->
<script src="data/qr-codes.js"></script>
<script>
(function () {
  // Old codes (no m) printed on the El Paseo Nov 27, 2026 card, the only card that went out with them.
  var PRINTED = {
    "reliable-roofing": "el-paseo:2026-11-27", "old-town-artisan-studios": "el-paseo:2026-11-27",
    "palm-royale-collective": "el-paseo:2026-11-27", "ristorante-mamma-gina": "el-paseo:2026-11-27",
    "foam-king": "el-paseo:2026-11-27", "all-in-one-realty-and-mortgage": "el-paseo:2026-11-27",
    "antex-exterminating": "el-paseo:2026-11-27", "casa-mendoza-palm-desert": "el-paseo:2026-11-27"
  };
  var q = new URLSearchParams(location.search), b = q.get("b") || "", m = q.get("m") || "", c = (q.get("c") || "").toLowerCase();
  if (c) { // short code: look it up (an unknown code goes to the home page)
    var hit = (window.CVS_QR_CODES || []).filter(function (x) { return x.c === c; })[0];
    b = hit ? hit.b : ""; m = hit ? hit.m : "";
  }
  var ok = /^[a-z0-9-]{2,60}$/.test(b);
  if (!/^[a-z0-9-]{2,40}:\d{4}-\d{2}-\d{2}$/.test(m)) m = (ok && Object.prototype.hasOwnProperty.call(PRINTED, b)) ? PRINTED[b] : "";
  var off = false;
  try { off = localStorage.getItem("cvs_notrack") === "1"; } catch (e) {}
  if (navigator.webdriver || /HeadlessChrome/.test(navigator.userAgent)) off = true;
  if (ok && !off) {
    var body = JSON.stringify(m ? { b: b, e: "scan", m: m } : { b: b, e: "scan" });
    try {
      if (!(navigator.sendBeacon && navigator.sendBeacon("https://cvs-tracker.toddstpierre.workers.dev/t", body)))
        fetch("https://cvs-tracker.toddstpierre.workers.dev/t", { method: "POST", body: body, keepalive: true });
    } catch (e) {}
  }
  location.replace(ok ? "business/" + b + "/?from=qr" + (m ? "&m=" + encodeURIComponent(m) : "") : "./");
})();
</script>
<style>body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f5ede1; color: #221c18; display: grid; place-items: center; min-height: 100vh; } a { color: #b8401c; }</style>
</head>
<body>
<p>Opening Coachella Valley Spotlight&hellip; <a href="./">Tap here</a> if nothing happens.</p>
</body>
</html>
