<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Coachella Valley Spotlight</title>
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<!-- Postcard QR codes point here: coachellavalleyspotlight.com/s?b=<listing slug>.
     Counts a "scan" for that business in the tracker (shown on their dashboard and Spotlight Report),
     then sends the visitor to the business's page with ?from=qr, which opens their deal ticket if they have one.
     Todd's own browsers (?notrack=1) and automated browsers are not counted, same as every other page. -->
<script>
(function () {
  var b = new URLSearchParams(location.search).get("b") || "";
  var ok = /^[a-z0-9-]{2,60}$/.test(b);
  var off = false;
  try { off = localStorage.getItem("cvs_notrack") === "1"; } catch (e) {}
  if (navigator.webdriver || /HeadlessChrome/.test(navigator.userAgent)) off = true;
  if (ok && !off) {
    var body = JSON.stringify({ b: b, e: "scan" });
    try {
      if (!(navigator.sendBeacon && navigator.sendBeacon("https://cvs-tracker.toddstpierre.workers.dev/t", body)))
        fetch("https://cvs-tracker.toddstpierre.workers.dev/t", { method: "POST", body: body, keepalive: true });
    } catch (e) {}
  }
  location.replace(ok ? "business/" + b + "/?from=qr" : "./");
})();
</script>
<style>body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f5ede1; color: #221c18; display: grid; place-items: center; min-height: 100vh; } a { color: #b8401c; }</style>
</head>
<body>
<p>Opening Coachella Valley Spotlight&hellip; <a href="./">Tap here</a> if nothing happens.</p>
</body>
</html>
