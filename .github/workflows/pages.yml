name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours: refreshes valley headlines; the first run after midnight Pacific also drops past events
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-profiles.js
      - run: node tools/build-headlines.js
        continue-on-error: true
      - run: node tools/build-feed-events.js
        continue-on-error: true
      - run: node tools/build-golf.js
      - run: node tools/build-seo.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing/IndexNow what changed: every page on a push or manual run; on the schedule, only the self-refreshing
      # pages, once a day (the 08:xx UTC run, just after midnight Pacific when the weekend window can move).
      - name: IndexNow
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then node tools/indexnow.js all
          elif [ "$(date -u +%H)" = "08" ]; then node tools/indexnow.js fresh
          fi
