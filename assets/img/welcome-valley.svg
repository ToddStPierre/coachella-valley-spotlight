  <path d="M566 294 C567 252 570 218 576 188 L579 188 C575 218 573 252 574 294 Z" fill="#5d5048"/>
  <path d="M577 188 c-16-5-32 0-43 11 14-5 28-6 42-4z M577 188 c-11-11-27-14-41-9 14 2 27 5 40 11z M577 188 c3-14 0-27-10-36 5 13 7 24 7 34z M577 188 c13-10 28-11 43-4-14 0-27 3-40 8z M577 188 c17 0 32 8 40 21-13-8-26-13-39-16z"/>
</g>

<!-- desert home -->
<g>
  <rect x="236" y="214" width="190" height="82" rx="3" fill="#fffaf3"/>
  <rect x="226" y="204" width="210" height="14" rx="3" fill="#221c18"/>
  <rect x="300" y="236" width="38" height="60" rx="2" fill="#d9552b"/>
  <circle cx="331" cy="268" r="2.4" fill="#f0a33a"/>
  <rect x="252" y="234" width="34" height="28" rx="2" fill="#5b4a7a" opacity=".85"/>
  <rect x="356" y="234" width="54" height="28" rx="2" fill="#5b4a7a" opacity=".85"/>
