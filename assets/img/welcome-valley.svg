<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="wv-t">
<title id="wv-t">A sunny Coachella Valley morning: mountains, palm trees and a desert home with a welcome mat</title>
<defs>
  <linearGradient id="wv-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7d9a8"/>
    <stop offset=".55" stop-color="#f5c08a"/>
    <stop offset="1" stop-color="#f0a33a"/>
  </linearGradient>
  <radialGradient id="wv-sun" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff3d6"/>
    <stop offset=".6" stop-color="#ffd27a"/>
    <stop offset="1" stop-color="#f0a33a"/>
  </radialGradient>
  <radialGradient id="wv-glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff3d6" stop-opacity=".7"/>
    <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="640" height="360" fill="url(#wv-sky)"/>
<circle cx="470" cy="112" r="100" fill="url(#wv-glow)"/>
<circle cx="470" cy="112" r="50" fill="url(#wv-sun)"/>

<!-- mountains -->
<path d="M0 360 L0 214 L80 172 L150 206 L236 140 L320 196 L400 160 L476 206 L560 150 L640 196 L640 360 Z" fill="#c9667a" opacity=".55"/>
<path d="M0 360 L0 246 L100 214 L180 240 L272 204 L360 242 L452 218 L540 248 L640 222 L640 360 Z" fill="#5b4a7a" opacity=".7"/>
<path d="M0 360 L0 284 L160 268 L330 286 L490 270 L640 282 L640 360 Z" fill="#e9d6b8"/>

